services:
  # PostgreSQL Database with PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: adma_geo_db
    environment:
      POSTGRES_DB: adma_geo
      POSTGRES_USER: adma_geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - adma_geo_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adma_geo -d adma_geo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: adma_geo_redis
    command: redis-server --appendonly yes
    volumes:
      - adma_geo_redis:/data
    ports:
      - "6380:6379"

  # Django Application
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adma_geo_django
    command: >
      sh -c "pip install docker websockets &&
             python manage.py migrate &&
             python manage.py create_system_tools &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - adma_geo_media:/app/media
      - adma_geo_static:/app/staticfiles
      - adma_agent_workspaces:/opt/adma/agent_workspaces
      - /run/user/1007/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8000"
    environment:
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      POSTGRES_DB: adma_geo
      POSTGRES_USER: adma_geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # GeoServer connection settings
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD must be set in .env}
      # Agent configuration
      RUNNING_IN_DOCKER: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AGENT_IMAGE: adma-openclaw-agent:latest
      AGENT_NETWORK: adma_geo_default
      AGENT_WORKSPACES_DIR: /opt/adma/agent_workspaces
      ADMA_INTERNAL_URL: http://django:8000
      ADMA_PUBLIC_URL: ${ADMA_PUBLIC_URL:-https://adma.unl.edu}
      AGENT_WORKSPACES_VOLUME: adma_geo_adma_agent_workspaces
      # Realm5 API
      REALM5_API_KEY: ${REALM5_API_KEY}
      # John Deere API (loaded from .env file)
      JD_CLIENT_ID: ${JD_CLIENT_ID}
      JD_CLIENT_SECRET: ${JD_CLIENT_SECRET}
      JD_REFRESH_TOKEN: ${JD_REFRESH_TOKEN}
      JD_ORG_ID: ${JD_ORG_ID}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adma_geo_celery
    command: >
      sh -c "pip install docker websockets &&
             celery -A adma_geo worker -l info"
    volumes:
      - .:/app
      - adma_geo_media:/app/media
      - adma_agent_workspaces:/opt/adma/agent_workspaces
      - /run/user/1007/docker.sock:/var/run/docker.sock
    environment:
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      POSTGRES_DB: adma_geo
      POSTGRES_USER: adma_geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # GeoServer connection settings
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD must be set in .env}
      # Agent configuration
      RUNNING_IN_DOCKER: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AGENT_IMAGE: adma-openclaw-agent:latest
      AGENT_NETWORK: adma_geo_default
      AGENT_WORKSPACES_DIR: /opt/adma/agent_workspaces
      ADMA_INTERNAL_URL: http://django:8000
      ADMA_PUBLIC_URL: ${ADMA_PUBLIC_URL:-https://adma.unl.edu}
      AGENT_WORKSPACES_VOLUME: adma_geo_adma_agent_workspaces
      # Realm5 API
      REALM5_API_KEY: ${REALM5_API_KEY}
      # John Deere API (loaded from .env file)
      JD_CLIENT_ID: ${JD_CLIENT_ID}
      JD_CLIENT_SECRET: ${JD_CLIENT_SECRET}
      JD_REFRESH_TOKEN: ${JD_REFRESH_TOKEN}
      JD_ORG_ID: ${JD_ORG_ID}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      django:
        condition: service_started

  # Celery Beat (Scheduler for periodic tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adma_geo_celery_beat
    # -s explicitly sets the schedule file path; some Celery versions don't
    # provide a default for app.conf.beat_schedule_filename and crash without it.
    command: celery -A adma_geo beat -l info -s /tmp/celerybeat-schedule
    volumes:
      - .:/app
    environment:
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      POSTGRES_DB: adma_geo
      POSTGRES_USER: adma_geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Realm5 API
      REALM5_API_KEY: ${REALM5_API_KEY}
      # John Deere API (loaded from .env file)
      JD_CLIENT_ID: ${JD_CLIENT_ID}
      JD_CLIENT_SECRET: ${JD_CLIENT_SECRET}
      JD_REFRESH_TOKEN: ${JD_REFRESH_TOKEN}
      JD_ORG_ID: ${JD_ORG_ID}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      celery:
        condition: service_started

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: adma_geo_nginx
    volumes:
      - ./nginx-adma.conf:/etc/nginx/nginx.conf
      - adma_geo_static:/var/www/static
      - adma_geo_media:/var/www/media
    ports:
      - "3000:80"
    depends_on:
      - django

  # GeoServer
  geoserver:
    image: kartoza/geoserver:2.25.2
    container_name: adma_geo_geoserver
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD must be set in .env}
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
      ENABLE_JSONP: "true"
      MAX_FILTER_RULES: 20
      OPTIMIZE_LINE_WIDTH: "false"
      FOOTPRINTS_DATA_DIR: /opt/footprints_dir
      GEOWEBCACHE_CACHE_DIR: /opt/geoserver/data_dir/gwc
      GEOSERVER_FILEBROWSER_HIDEFS: "false"
      STABLE_EXTENSIONS: "wps,csw,inspire,control-flow,monitor,audit"
      COMMUNITY_EXTENSIONS: ""
    volumes:
      - adma_geo_geoserver_data:/opt/geoserver/data_dir
      - adma_geo_media:/app/media
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/index.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  default:
    name: adma_geo_default

volumes:
  adma_geo_db:
    driver: local
  adma_geo_redis:
    driver: local
  adma_geo_media:
    driver: local
  adma_geo_static:
    driver: local
  adma_geo_geoserver_data:
    driver: local
  adma_agent_workspaces:
    driver: local
