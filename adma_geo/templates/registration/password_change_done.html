{% extends 'base.html' %}

{% block title %}Password changed - ADMA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5 text-center">
                <i class="fas fa-circle-check" style="font-size: 3rem; color: #28a745;"></i>
                <h2 class="mt-3 mb-1">Password changed</h2>
                <p class="text-muted">Your new password is in effect.</p>
                <a href="{% url 'filemanager:profile' %}" class="btn btn-primary mt-2">
                    <i class="fas fa-user me-2"></i>Back to profile
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
