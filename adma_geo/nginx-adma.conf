events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=geoserver:10m rate=50r/s;  # More lenient for GeoServer

    # Docker's embedded DNS. nginx resolves a hostname in an upstream block or
    # a literal proxy_pass exactly once, at startup, and caches the address
    # forever -- so every time the django container was recreated onto a
    # different address the whole site returned 502 until nginx itself was
    # restarted. Naming the resolver and putting the upstream behind a variable
    # makes nginx re-resolve, honouring the TTL below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # All traffic reaching this inner nginx has already been terminated as
    # HTTPS by the outer UNL reverse proxy — adma.unl.edu is HTTPS-only at
    # the edge. Hardcode "https" so Django's request.is_secure() returns
    # True regardless of whether the outer layer remembers to set
    # X-Forwarded-Proto. This is safe because the outer layer is the only
    # ingress; nothing else can reach this inner nginx directly.
    map $host $real_forwarded_proto {
        default "https";
    }

    server {
        listen 80;
        server_name localhost adma.unl.edu;

        # Resolved per request rather than once at startup; see the resolver
        # comment above. Keep the values in one place so the locations below
        # cannot drift apart. Declared at server level so a location that uses
        # "rewrite ... break" cannot skip the assignment.
        set $django_upstream http://django:8000;
        set $geoserver_upstream http://geoserver:8080;

        # Defense in depth: refuse to serve dotfiles, source files, secrets.
        location ~ /\.(?!well-known/) { deny all; return 404; }
        location ~ \.(py|env|git|bak|swp|swo|sqlite3)$ { deny all; return 404; }

        autoindex off;

        # Hard cap for entire request body. Django spools anything above
        # FILE_UPLOAD_MAX_MEMORY_SIZE (10MB) to disk, so this 2G allows
        # large GeoTIFF uploads without ever holding them in RAM.
        client_max_body_size 2G;

        # Security headers for HTTPS/HTTP compatibility
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        location /static/ {
            alias /var/www/static/;
        }

        location /media/ {
            alias /var/www/media/;
        }

        # GeoServer WMS proxy.
        #
        # This used to be a plain "proxy_pass http://geoserver:8080/geoserver/
        # adma_geo/wms", which let nginx swap the matched "/wms" prefix for
        # that path -- but a literal host there is resolved once at startup and
        # cached for the life of the process, the same defect the django
        # locations had. Routing the request through the variable makes nginx
        # re-resolve, and nginx will not do prefix substitution against a
        # variable, so the rewrite below performs that swap explicitly. It
        # reproduces the old mapping exactly, "/wmsfoo" included: the prefix
        # never required a boundary after "/wms". The query string rides along
        # untouched because the replacement contains no "?".
        location /wms {
            rewrite ^/wms(.*)$ /geoserver/adma_geo/wms$1 break;
            proxy_pass $geoserver_upstream;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # GeoServer REST API proxy with rate limiting
        location /geoserver/ {
            # Apply lenient rate limiting for GeoServer (allow bursts for tile loading)
            limit_req zone=geoserver burst=20 nodelay;
            
            # The old proxy_pass replaced the "/geoserver/" prefix with
            # "/geoserver/" -- an identity mapping -- so forwarding the
            # client's URI verbatim is the same thing, minus the cached address.
            proxy_pass $geoserver_upstream$request_uri;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Handle index.html specifically (from Apache)
        location = /index.html {
            proxy_pass $django_upstream/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Handle index.htm as well (in case)
        location = /index.htm {
            proxy_pass $django_upstream/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # OPTIONAL but recommended for production: restrict /admin/ to internal IPs.
        # Uncomment and adjust the allow list to match your trusted CIDR ranges.
        # location /admin/ {
        #     allow 129.93.0.0/16;   # UNL campus
        #     allow 127.0.0.1;
        #     deny all;
        #     proxy_pass http://django:8000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # Handle all other requests with general rate limiting
        location / {
            # Apply general rate limiting for Django requests
            limit_req zone=general burst=10 nodelay;
            
            proxy_pass $django_upstream$request_uri;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $real_forwarded_proto;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
