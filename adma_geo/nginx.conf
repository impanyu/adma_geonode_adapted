events {
    worker_connections 1024;
}

http {
    upstream django {
        server django:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Defense in depth: refuse to serve dotfiles, source files, secrets.
        location ~ /\.(?!well-known/) { deny all; return 404; }
        location ~ \.(py|env|git|bak|swp|swo|sqlite3)$ { deny all; return 404; }

        autoindex off;

        # Hard cap for entire request body. Django spools anything above
        # FILE_UPLOAD_MAX_MEMORY_SIZE (10MB) to disk, so this 2G allows
        # large GeoTIFF uploads without ever holding them in RAM.
        client_max_body_size 2G;

        location /static/ {
            alias /var/www/static/;
        }

        location /media/ {
            alias /var/www/media/;
        }

        # GeoServer WMS proxy
        location /wms {
            proxy_pass http://geoserver:8080/geoserver/adma_geo/wms;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # GeoServer REST API proxy
        location /geoserver/ {
            proxy_pass http://geoserver:8080/geoserver/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Handle index.html specifically (from Apache)
        location = /index.html {
            proxy_pass http://django/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Handle index.htm as well (in case)
        location = /index.htm {
            proxy_pass http://django/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
